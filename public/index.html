<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review QR Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 20px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .info-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 1rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: left;
      border: 1px solid #334155;
    }
    .info-box code {
      color: #38bdf8;
      font-family: monospace;
    }
    .footer {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-dot">
      <span class="dot"></span>
      Service Operational
    </div>
    <h1>Google Review QR Service</h1>
    <p>
      Layanan pengalihan pintar (*smart redirection*) dan telemetri untuk stiker QR Google Review meja & kasir.
    </p>
    <div class="info-box">
      <strong>Format Scan QR:</strong><br>
      <code>https://greview-qr.netlify.app/id/:id</code>
    </div>
    <div class="footer">
      Powered by Netlify Functions &bull; Turso libSQL
    </div>
  </div>
</body>
</html>
